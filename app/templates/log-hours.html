{% extends "authenticated-base.html" %}
{% block title %}Log Volunteer Hours · Bloom{% endblock %}

{% block subpage_content %}
<div class="container-fluid py-2">
  <div class="mx-auto" style="max-width: 760px;">
    <h1 class="h3 text-center mb-4">Log Volunteer Hours</h1>

    {% for message in get_flashed_messages(request) %}
    <div class="alert alert-{{ message.type }}" role="status">{{ message.message }}</div>
    {% endfor %}

    <form method="post" action="{{ url_for('submit_volunteer_hours') }}" class="card border-0 shadow-sm p-4 p-md-5">
      <div class="mb-3">
        <label class="form-label" for="activity_name">Activity Name</label>
        <input class="form-control" id="activity_name" name="activity_name" type="text" required>
      </div>
      <div class="mb-4">
        <label class="form-label" for="organization">Organization</label>
        <input class="form-control" id="organization" name="organization" type="text" required>
      </div>
      <div class="row g-3 mb-4">
        <div class="col-sm-4">
          <label class="form-label" for="hours">Hours</label>
          <input class="form-control" id="hours" name="hours" type="number" min="0.01" step="0.01" required>
        </div>
        <div class="col-sm-4">
          <label class="form-label" for="date">Date</label>
          <input class="form-control" id="date" name="date" type="date" required>
        </div>
      </div>
      <div class="d-flex justify-content-between align-items-center gap-3">
        <a href="{{ url_for('user_home_view') }}" class="link-secondary">← Back to Dashboard</a>
        <button class="btn btn-primary" type="submit">Submit</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
