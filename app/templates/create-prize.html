{% extends "authenticated-base.html" %}
{% block title %}Create Prize · Bloom{% endblock %}

{% block subpage_content %}
<div class="container-fluid py-2 py-lg-4">
  <div class="mx-auto" style="max-width: 760px;">
    <h1 class="h3 text-center mb-4">Create Prize</h1>

    {% for message in get_flashed_messages(request) %}
    <div class="alert alert-{{ message.type }}" role="status">{{ message.message }}</div>
    {% endfor %}

    <form method="post" action="{{ url_for('create_prize') }}" class="card border-0 shadow-sm rounded-4 p-4 p-md-5">
      <div class="mb-3">
        <label class="form-label" for="name">Prize Name</label>
        <input class="form-control" id="name" name="name" type="text" required>
      </div>
      <div class="mb-4">
        <label class="form-label" for="description">Description</label>
        <textarea class="form-control" id="description" name="description" rows="3" required></textarea>
      </div>
      <div class="row g-3 mb-4">
        <div class="col-sm-4">
          <label class="form-label" for="cost_in_hours">Cost (Hours)</label>
          <input class="form-control" id="cost_in_hours" name="cost_in_hours" type="number" min="1" step="1" required>
        </div>
        <div class="col-sm-5">
          <label class="form-label" for="quantity_available">Quantity Available</label>
          <input class="form-control" id="quantity_available" name="quantity_available" type="number" min="0" step="1" required>
        </div>
      </div>
      <div class="d-flex justify-content-between align-items-center gap-3">
        <a href="{{ url_for('admin_home_view') }}" class="link-secondary">← Back to Dashboard</a>
        <button class="btn btn-primary" type="submit">Create</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
